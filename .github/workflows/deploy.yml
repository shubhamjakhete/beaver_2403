name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Purge stale _next/ over FTP
        # lftp is pre-installed on GitHub's ubuntu-latest runner.
        # Deletes only _next/ using the existing FTP credentials — api/ is never touched.
        # This runs before the upload so the fresh build always lands on a clean slate
        # without accumulating old content-hashed chunks that fill up disk.
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTPS_USER }}","${{ secrets.FTPS_PASS }}" \
               -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; rm -rf /bew-p2304.com/projects/2403/_next/; bye" \
               "${{ secrets.FTPS_HOST }}"

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTPS_HOST }}
          username: ${{ secrets.FTPS_USER }}
          password: ${{ secrets.FTPS_PASS }}
          protocol: ftps
          local-dir: ./out/
          server-dir: /bew-p2304.com/projects/2403/
          # dangerous-clean-slate is intentionally OMITTED (defaults to false).
          # Enabling it wipes the entire server-dir before upload, which deletes
          # api/ even when api/** is in the exclude list — the exclude only
          # controls what gets uploaded, not what gets wiped.
          # Without clean-slate the action does a differential sync: it uploads
          # new/changed files and leaves everything else on the server untouched.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/**
